# Routine version updates run monthly to keep the pull-request queue small.
# Security updates are a separate repository setting and remain enabled; this
# schedule does not delay them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /services/api
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
